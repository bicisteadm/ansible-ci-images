---
- name: Test Azure Pipelines Agent Role
  hosts: test-containers
  become: true
  gather_facts: true
  
  roles:
    - role: azure-pipelines-agent
      vars:
        # Test configuration - install only basic tools
        install_basic_packages: true
        install_ci_cd_tools: true
        install_azure_tools: false
        install_cloud_tools: false
        install_development_tools: false
        install_compilers: false
        install_version_control: true
        install_programming_languages: false
        install_infrastructure_tools: false
        install_utilities: false
        install_databases: false
        install_browsers: false
        install_container_tools: false
        install_specialized_tools: false
        install_package_managers: false
        
        # Test version
        image_version: "test-1.0.0"
        
  post_tasks:
    - name: Test PowerShell installation
      command: pwsh -c "Get-Host"
      register: powershell_test
      failed_when: powershell_test.rc != 0
      
    - name: Test Git installation
      command: git --version
      register: git_test
      failed_when: git_test.rc != 0
      
    - name: Display test results
      debug:
        msg: |
          Test Results:
          - PowerShell: {{ 'OK' if powershell_test.rc == 0 else 'FAILED' }}
          - Git: {{ 'OK' if git_test.rc == 0 else 'FAILED' }}
          
          Role successfully installed on Ubuntu {{ ansible_distribution_version }}! 
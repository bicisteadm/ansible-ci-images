# Příklad inventory souboru pro playbook
# Upravte IP adresy a přihlašovací údaje podle vašeho prostředí

[ubuntu_containers]
# Příklady hostů - nahraďte skutečnými IP adresami nebo názvy hostů
ubuntu-container-1 ansible_host=172.16.1.147 ansible_user=root
#ubuntu-container-2 ansible_host=192.168.1.101 ansible_user=ubuntu
# ubuntu-container-3 ansible_host=192.168.1.102 ansible_user=root

[ubuntu_containers:vars]
# Společné proměnné pro všechny Ubuntu kontejnery
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# Pokud používáte SSH klíče
# ansible_ssh_private_key_file=~/.ssh/id_rsa

# Pokud potřebujete heslo (nedoporučuje se pro produkci)
# ansible_ssh_pass=your_password
# ansible_become_pass=your_sudo_password 
---
# Basic playbook for Azure Pipelines Agent installation
# This playbook uses the role with default settings

- name: Setup Azure Pipelines Agent with default settings
  hosts: ubuntu_containers
  become: yes
  become_method: sudo
  gather_facts: yes
  
  # Using local role from root directory
  roles:
    - role: /Users/adam/Documents/Projects/ansible-ci-images
        
  post_tasks:
    - name: Display information about completed installation
      debug:
        msg: 
          - "Azure Pipelines Agent has been successfully installed!"
          - "Image version: {{ image_version }}"
          - "OS: {{ image_os }}"
          - "Installation folder: {{ image_folder }}" 
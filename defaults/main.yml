---
# Image information - default values
image_version: "20250629.1.0"
image_os: "ubuntu22"

# Directory structure matching original Packer setup
image_folder: "/imagegeneration"
installer_script_folder: "/imagegeneration/installers"
helper_script_folder: "/imagegeneration/helpers"
toolcache_root: "/opt/hostedtoolcache"

# Environment variables
debian_frontend: "noninteractive"

# Optional Docker Hub login credentials
dockerhub_login: ""
dockerhub_password: ""

# ========================================
# Runner Images Submodule Paths
# ========================================
# Base paths to runner-images submodule content
runner_images_base: "{{ role_path }}/runner-images"
runner_images_ubuntu: "{{ runner_images_base }}/images/ubuntu"

# Source paths for copying files from submodule
runner_images_helpers_src: "{{ runner_images_ubuntu }}/scripts/helpers/"
runner_images_build_src: "{{ runner_images_ubuntu }}/scripts/build/"
runner_images_tests_src: "{{ runner_images_ubuntu }}/scripts/tests/"
runner_images_docs_gen_src: "{{ runner_images_ubuntu }}/scripts/docs-gen/"
runner_images_post_gen_src: "{{ runner_images_ubuntu }}/assets/post-gen/"
runner_images_toolset_src: "{{ runner_images_ubuntu }}/toolsets/toolset-2204.json"
runner_images_ubuntu_conf_src: "{{ runner_images_ubuntu }}/assets/ubuntu2204.conf"
runner_images_software_report_src: "{{ runner_images_base }}/helpers/software-report-base/"

# Control what gets installed with these boolean flags
install_basic_packages: true
install_ci_cd_tools: true
install_azure_tools: true
install_cloud_tools: true
install_development_tools: true
install_compilers: true
install_version_control: true
install_programming_languages: true
install_infrastructure_tools: true
install_utilities: true
install_databases: true
install_browsers: true
install_container_tools: true
install_specialized_tools: true
install_package_managers: true

# Target user for installations that require non-root user
target_user: "{{ ansible_user | default('root') }}"

# System configuration
configure_system_limits: true
configure_environment: true
configure_dpkg: true
configure_snap: true 
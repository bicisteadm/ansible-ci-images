---
# ========================================
# Azure Pipelines Agent Installation Role
# ========================================
# Converted from Packer build - following exact sequence
# Using official runner-images scripts via git submodule

# Pre-flight checks
- name: Verify Ubuntu version
  assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version == "22.04"
    fail_msg: "This role is designed for Ubuntu 22.04 only"

# ========================================
# Phase 1: Directory creation and initial setup
# (equivalent to: mkdir ${var.image_folder}, chmod 777 ${var.image_folder})
# ========================================

- name: Create image folder with 777 permissions
  file:
    path: "{{ image_folder }}"
    state: directory
    mode: '0777'

- name: Create installer script folder
  file:
    path: "{{ installer_script_folder }}"
    state: directory
    mode: '0755'

- name: Create helper script folder
  file:
    path: "{{ helper_script_folder }}"
    state: directory
    mode: '0755'

# ========================================
# Phase 2: Copy helper scripts
# (equivalent to: provisioner "file" helpers -> helper_script_folder)
# ========================================

- name: Copy helper scripts to target
  copy:
    src: "{{ runner_images_helpers_src }}"
    dest: "{{ helper_script_folder }}/"
    mode: '0755'

# ========================================
# Phase 3: Configure APT mock
# (equivalent to: configure-apt-mock.sh)
# ========================================

- name: Configure APT mock (if needed)
  shell: "{{ installer_script_folder }}/configure-apt-mock.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    DEBIAN_FRONTEND: "{{ debian_frontend }}"
  ignore_errors: true

# ========================================
# Phase 4: APT configuration scripts
# (equivalent to: install-ms-repos.sh, configure-apt-sources.sh, configure-apt.sh)
# ========================================

- name: Install Microsoft repositories
  shell: "{{ installer_script_folder }}/install-ms-repos.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    DEBIAN_FRONTEND: "{{ debian_frontend }}"

- name: Configure APT sources
  shell: "{{ installer_script_folder }}/configure-apt-sources.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    DEBIAN_FRONTEND: "{{ debian_frontend }}"

- name: Configure APT settings
  shell: "{{ installer_script_folder }}/configure-apt.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    DEBIAN_FRONTEND: "{{ debian_frontend }}"

# ========================================
# Phase 5: Configure system limits
# (equivalent to: configure-limits.sh)
# ========================================

- name: Configure system limits
  shell: "{{ installer_script_folder }}/configure-limits.sh"
  when: configure_system_limits | default(true)

# ========================================
# Phase 6: Copy build scripts to installer folder
# (equivalent to: provisioner "file" build -> installer_script_folder)
# ========================================

- name: Copy build scripts to installer folder
  copy:
    src: "{{ runner_images_build_src }}"
    dest: "{{ installer_script_folder }}/"
    mode: '0755'

# ========================================
# Phase 7: Copy assets (post-gen, tests, docs-gen)
# (equivalent to: multiple file provisioners for assets)
# ========================================

- name: Create directories for assets
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ image_folder }}/post-gen"
    - "{{ image_folder }}/tests"
    - "{{ image_folder }}/docs-gen"

- name: Copy post-generation assets
  copy:
    src: "{{ runner_images_post_gen_src }}"
    dest: "{{ image_folder }}/post-gen/"
    mode: '0755'
  ignore_errors: true

- name: Copy test scripts
  copy:
    src: "{{ runner_images_tests_src }}"
    dest: "{{ image_folder }}/tests/"
    mode: '0755'

- name: Copy docs generation scripts
  copy:
    src: "{{ runner_images_docs_gen_src }}"
    dest: "{{ image_folder }}/docs-gen/"
    mode: '0755'
  ignore_errors: true

# ========================================
# Phase 8: Copy software report base
# (equivalent to: software-report-base -> docs-gen/)
# ========================================

- name: Copy software report base
  copy:
    src: "{{ runner_images_software_report_src }}"
    dest: "{{ image_folder }}/docs-gen/"
    mode: '0755'
  ignore_errors: true

# ========================================
# Phase 9: Copy toolset configuration
# (equivalent to: toolset-2204.json -> toolset.json)
# ========================================

- name: Copy toolset configuration
  copy:
    src: "{{ runner_images_toolset_src }}"
    dest: "{{ installer_script_folder }}/toolset.json"
    mode: '0644'

# ========================================
# Phase 10: Rename directories
# (equivalent to: mv docs-gen SoftwareReport, mv post-gen post-generation)
# ========================================

- name: Rename docs-gen to SoftwareReport
  command: mv "{{ image_folder }}/docs-gen" "{{ image_folder }}/SoftwareReport"
  ignore_errors: true

- name: Rename post-gen to post-generation
  command: mv "{{ image_folder }}/post-gen" "{{ image_folder }}/post-generation"
  ignore_errors: true

# ========================================
# Phase 11: Configure image data
# (equivalent to: configure-image-data.sh)
# ========================================

- name: Configure image data
  shell: "{{ installer_script_folder }}/configure-image-data.sh"
  environment:
    IMAGE_VERSION: "{{ image_version }}"
    IMAGEDATA_FILE: "{{ image_folder }}/imagedata.json"

# ========================================
# Phase 12: Configure environment
# (equivalent to: configure-environment.sh)
# ========================================

- name: Configure environment
  shell: "{{ installer_script_folder }}/configure-environment.sh"
  environment:
    IMAGE_VERSION: "{{ image_version }}"
    IMAGE_OS: "{{ image_os }}"
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
  when: configure_environment | default(true)

# ========================================
# Phase 13: Install vital APT packages
# (equivalent to: install-apt-vital.sh)
# ========================================

- name: Install vital APT packages
  shell: "{{ installer_script_folder }}/install-apt-vital.sh"
  environment:
    DEBIAN_FRONTEND: "{{ debian_frontend }}"
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"

# ========================================
# Phase 14: Install PowerShell
# (equivalent to: install-powershell.sh)
# ========================================

- name: Install PowerShell
  shell: "{{ installer_script_folder }}/install-powershell.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"

# ========================================
# Phase 15: Install PowerShell modules
# (equivalent to: Install-PowerShellModules.ps1, Install-PowerShellAzModules.ps1)
# ========================================

- name: Install PowerShell modules
  shell: "pwsh -f {{ installer_script_folder }}/Install-PowerShellModules.ps1"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"

- name: Install PowerShell Azure modules

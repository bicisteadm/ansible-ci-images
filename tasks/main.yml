    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
    DEBIAN_FRONTEND: "{{ debian_frontend }}"
  when: install_infrastructure_tools | default(true)

- name: Install VCPKG
  shell: "{{ installer_script_folder }}/install-vcpkg.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
    DEBIAN_FRONTEND: "{{ debian_frontend }}"
  when: install_development_tools | default(true)

- name: Configure DPKG
  shell: "{{ installer_script_folder }}/configure-dpkg.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
    DEBIAN_FRONTEND: "{{ debian_frontend }}"
  when: configure_dpkg | default(true)

- name: Install YQ
  shell: "{{ installer_script_folder }}/install-yq.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
    DEBIAN_FRONTEND: "{{ debian_frontend }}"
  when: install_utilities | default(true)

- name: Install Android SDK
  shell: "{{ installer_script_folder }}/install-android-sdk.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
    DEBIAN_FRONTEND: "{{ debian_frontend }}"
  when: install_specialized_tools | default(true)

- name: Install PyPy
  shell: "{{ installer_script_folder }}/install-pypy.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
    DEBIAN_FRONTEND: "{{ debian_frontend }}"
  when: install_programming_languages | default(true)

- name: Install Python
  shell: "{{ installer_script_folder }}/install-python.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
    DEBIAN_FRONTEND: "{{ debian_frontend }}"
  when: install_programming_languages | default(true)

- name: Install Zstd
  shell: "{{ installer_script_folder }}/install-zstd.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
    DEBIAN_FRONTEND: "{{ debian_frontend }}"
  when: install_utilities | default(true)

- name: Install Ninja
  shell: "{{ installer_script_folder }}/install-ninja.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
    DEBIAN_FRONTEND: "{{ debian_frontend }}"
  when: install_development_tools | default(true)

# ========================================
# Phase 17: Install Docker (with credentials)
# (equivalent to: install-docker.sh with DOCKERHUB credentials)
# ========================================

- name: Install Docker
  shell: "{{ installer_script_folder }}/install-docker.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
    DOCKERHUB_LOGIN: "{{ dockerhub_login | default('') }}"
    DOCKERHUB_PASSWORD: "{{ dockerhub_password | default('') }}"
  when: install_container_tools | default(true)

# ========================================
# Phase 18: PowerShell toolset configuration
# (equivalent to: Install-Toolset.ps1, Configure-Toolset.ps1)
# ========================================

- name: Install toolset via PowerShell
  shell: "pwsh -f {{ installer_script_folder }}/Install-Toolset.ps1"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"

- name: Configure toolset via PowerShell
  shell: "pwsh -f {{ installer_script_folder }}/Configure-Toolset.ps1"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"

# ========================================
# Phase 19: Install pipx packages
# (equivalent to: install-pipx-packages.sh)
# ========================================

- name: Install pipx packages
  shell: "{{ installer_script_folder }}/install-pipx-packages.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
  when: install_programming_languages | default(true)

# ========================================
# Phase 20: Install Homebrew (as non-root user)
# (equivalent to: install-homebrew.sh with different execute_command)
# ========================================

- name: Install Homebrew
  shell: "{{ installer_script_folder }}/install-homebrew.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    DEBIAN_FRONTEND: "{{ debian_frontend }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
  become: false
  become_user: "{{ target_user }}"
  when: install_package_managers | default(true)

# ========================================
# Phase 21: Configure snap
# (equivalent to: configure-snap.sh)
# ========================================

- name: Configure snap
  shell: "{{ installer_script_folder }}/configure-snap.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
  when: configure_snap | default(true)

# ========================================
# Phase 22: LXC compatibility (fake VM files)
# (NOTE: This replaces the reboot step from Packer since LXC doesn't need reboot)
# ========================================

- name: Create fake files for LXC compatibility
  include_tasks: lxc-compatibility.yml

# ========================================
# Phase 23: Cleanup
# (equivalent to: cleanup.sh with pause_before and start_retry_timeout)
# ========================================

- name: Run cleanup (with pause like in Packer)
  shell: "{{ installer_script_folder }}/cleanup.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"

# ========================================
# Phase 24: Generate software reports
# (equivalent to: Generate-SoftwareReport.ps1, RunAll-Tests.ps1)
# ========================================

- name: Generate software report
  shell: "pwsh -File {{ image_folder }}/SoftwareReport/Generate-SoftwareReport.ps1 -OutputDirectory {{ image_folder }}"
  environment:
    IMAGE_VERSION: "{{ image_version }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
  ignore_errors: true

- name: Run all tests
  shell: "pwsh -File {{ image_folder }}/tests/RunAll-Tests.ps1 -OutputDirectory {{ image_folder }}"
  environment:
    IMAGE_VERSION: "{{ image_version }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
  ignore_errors: true

# ========================================
# Phase 25: Download reports (fetch to localhost)
# (equivalent to: provisioner "file" direction="download")
# ========================================

- name: Fetch Ubuntu README to control machine
  fetch:
    src: "{{ image_folder }}/software-report.md"
    dest: "./Ubuntu2204-Readme.md"
    flat: yes
  ignore_errors: true

- name: Fetch software report JSON to control machine
  fetch:
    src: "{{ image_folder }}/software-report.json"
    dest: "./software-report.json"
    flat: yes
  ignore_errors: true

# ========================================
# Phase 26: Configure system
# (equivalent to: configure-system.sh)
# ========================================

- name: Configure system
  shell: "{{ installer_script_folder }}/configure-system.sh"
  environment:
    HELPER_SCRIPT_FOLDER: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
    IMAGE_FOLDER: "{{ image_folder }}"

# ========================================
# Phase 27: Copy machine instance config
# (equivalent to: copy ubuntu2204.conf and move to /etc/vsts/)
# ========================================

- name: Create /etc/vsts directory
  file:
    path: /etc/vsts
    state: directory
    mode: '0755'

- name: Copy machine instance configuration
  copy:
    src: "{{ runner_images_ubuntu_conf_src }}"
    dest: "/etc/vsts/machine_instance.conf"
    mode: '0644'
  ignore_errors: true

# ========================================
# Phase 28: Post-build validation
# (equivalent to: post-build-validation.sh)
# ========================================

- name: Run post-build validation
  shell: "{{ installer_script_folder }}/post-build-validation.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
  ignore_errors: true

# ========================================
# Phase 29: Final cleanup for LXC
# (NOTE: skipping waagent deprovision since it's Azure-specific)
# ========================================

- name: Clean up fake files created for LXC compatibility
  include_tasks: lxc-cleanup.yml

- name: Final sleep (like in original Packer)
  pause:
    seconds: 30

# ========================================
# Phase 30: Installation summary
# ========================================

- name: Display installation summary
  debug:
    msg: |
      Azure Pipelines Agent installation completed successfully!
      Image Version: {{ image_version }}
      Image OS: {{ image_os }}
      Toolcache Directory: {{ toolcache_root }}
      
      All selected installation scripts have been executed following the exact Packer sequence.
      Scripts are sourced from official runner-images git submodule using clean variables.
      Reports have been generated and fetched to the control machine. 
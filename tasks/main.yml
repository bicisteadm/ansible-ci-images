---
# ========================================
# Azure Pipelines Agent Installation Role - Version 2
# ========================================
# EXACT copy of runner-images/images/ubuntu/templates/build.ubuntu-22_04.pkr.hcl
# Converted to Ansible - linear sequence without conditionals
# 
# This is 1:1 mapping of the original Packer provisioners

- name: Create fake files for LXC compatibility
  include_tasks: lxc-compatibility.yml

# ========================================
# Provisioner 1: Create directories
# (inline: mkdir + chmod)
# ========================================

- name: Create image folder and set permissions
  shell: |
    mkdir {{ image_folder }}
    chmod 777 {{ image_folder }}
  ignore_errors: true

# ========================================  
# Provisioner 2: Copy helper scripts
# (file: helpers -> helper_script_folder)
# ========================================

- name: Copy helper scripts to target
  copy:
    src: "{{ runner_images_helpers_src }}"
    dest: "{{ helper_script_folder }}/"
    mode: '0755'

# ========================================
# Provisioner 3: Configure APT mock
# (shell: configure-apt-mock.sh)
# ========================================

- name: Configure APT mock
  shell: "{{ runner_images_build_src }}/configure-apt-mock.sh"

# ========================================
# Provisioner 4: APT configuration scripts
# (shell: install-ms-repos, configure-apt-sources, configure-apt)
# ========================================

- name: Configure APT repositories and settings
  shell: |
    {{ runner_images_build_src }}/install-ms-repos.sh
    {{ runner_images_build_src }}/configure-apt-sources.sh  
    {{ runner_images_build_src }}/configure-apt.sh
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    DEBIAN_FRONTEND: "noninteractive"

# ========================================
# Provisioner 5: Configure system limits
# (shell: configure-limits.sh)
# ========================================

- name: Configure system limits
  shell: "{{ runner_images_build_src }}/configure-limits.sh"

# ========================================
# Provisioner 6: Copy build scripts
# (file: build -> installer_script_folder)
# ========================================

- name: Copy build scripts to installer folder
  copy:
    src: "{{ runner_images_build_src }}"
    dest: "{{ installer_script_folder }}/"
    mode: '0755'

# ========================================
# Provisioner 7: Copy assets (multiple sources)
# (file: post-gen, tests, docs-gen -> image_folder)
# ========================================

- name: Copy post-generation assets
  copy:
    src: "{{ runner_images_post_gen_src }}"
    dest: "{{ image_folder }}/post-gen/"
    mode: '0755'

- name: Copy test scripts
  copy:
    src: "{{ runner_images_tests_src }}"
    dest: "{{ image_folder }}/tests/"
    mode: '0755'

- name: Copy docs generation scripts
  copy:
    src: "{{ runner_images_docs_gen_src }}"
    dest: "{{ image_folder }}/docs-gen/"
    mode: '0755'

# ========================================
# Provisioner 8: Copy software report base
# (file: software-report-base -> docs-gen/)
# ========================================

- name: Copy software report base
  copy:
    src: "{{ runner_images_software_report_src }}"
    dest: "{{ image_folder }}/docs-gen/"
    mode: '0755'

# ========================================
# Provisioner 9: Copy toolset configuration
# (file: toolset-2204.json -> toolset.json)
# ========================================

- name: Copy toolset configuration
  copy:
    src: "{{ runner_images_toolset_src }}"
    dest: "{{ installer_script_folder }}/toolset.json"
    mode: '0644'

# ========================================
# Provisioner 10: Rename directories
# (inline: mv commands)
# ========================================

- name: Rename directories
  shell: |
    mv {{ image_folder }}/docs-gen {{ image_folder }}/SoftwareReport
    mv {{ image_folder }}/post-gen {{ image_folder }}/post-generation

# ========================================
# Provisioner 11: Configure image data
# (shell: configure-image-data.sh)
# ========================================

- name: Configure image data
  shell: "{{ installer_script_folder }}/configure-image-data.sh"
  environment:
    IMAGE_VERSION: "{{ image_version }}"
    IMAGEDATA_FILE: "{{ image_folder }}/imagedata.json"

# ========================================
# Provisioner 12: Configure environment
# (shell: configure-environment.sh)
# ========================================

- name: Configure environment
  shell: "{{ installer_script_folder }}/configure-environment.sh"
  environment:
    IMAGE_VERSION: "{{ image_version }}"
    IMAGE_OS: "{{ image_os }}"
    HELPER_SCRIPTS: "{{ helper_script_folder }}"

# ========================================
# Provisioner 13: Install vital APT packages
# (shell: install-apt-vital.sh)
# ========================================

- name: Install vital APT packages
  shell: "{{ installer_script_folder }}/install-apt-vital.sh"
  environment:
    DEBIAN_FRONTEND: "noninteractive"
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"

# ========================================
# Provisioner 14: Install PowerShell
# (shell: install-powershell.sh)
# ========================================

- name: Install PowerShell
  shell: "{{ installer_script_folder }}/install-powershell.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"

# ========================================
# Provisioner 15: Install PowerShell modules
# (shell: PowerShell scripts with pwsh)
# ========================================

- name: Install PowerShell modules
  shell: |
    pwsh -f {{ installer_script_folder }}/Install-PowerShellModules.ps1
    pwsh -f {{ installer_script_folder }}/Install-PowerShellAzModules.ps1
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"

# ========================================
# Provisioner 16: MASSIVE installation block
# (shell: ALL installation scripts in exact Packer order)
# This is the big provisioner with 50+ scripts in one block
# ========================================

- name: Run all installation scripts (massive Packer block)
  shell: |
    {{ installer_script_folder }}/install-actions-cache.sh
    {{ installer_script_folder }}/install-runner-package.sh
    {{ installer_script_folder }}/install-apt-common.sh
    {{ installer_script_folder }}/install-azcopy.sh
    {{ installer_script_folder }}/install-azure-cli.sh
    {{ installer_script_folder }}/install-azure-devops-cli.sh
    {{ installer_script_folder }}/install-bicep.sh
    {{ installer_script_folder }}/install-aliyun-cli.sh
    {{ installer_script_folder }}/install-apache.sh
    {{ installer_script_folder }}/install-aws-tools.sh
    {{ installer_script_folder }}/install-clang.sh
    {{ installer_script_folder }}/install-swift.sh
    {{ installer_script_folder }}/install-cmake.sh
    {{ installer_script_folder }}/install-codeql-bundle.sh
    {{ installer_script_folder }}/install-container-tools.sh
    {{ installer_script_folder }}/install-dotnetcore-sdk.sh
    {{ installer_script_folder }}/install-firefox.sh
    {{ installer_script_folder }}/install-microsoft-edge.sh
    {{ installer_script_folder }}/install-gcc-compilers.sh
    {{ installer_script_folder }}/install-gfortran.sh
    {{ installer_script_folder }}/install-git.sh
    {{ installer_script_folder }}/install-git-lfs.sh
    {{ installer_script_folder }}/install-github-cli.sh
    {{ installer_script_folder }}/install-google-chrome.sh
    {{ installer_script_folder }}/install-google-cloud-cli.sh
    {{ installer_script_folder }}/install-haskell.sh
    {{ installer_script_folder }}/install-heroku.sh
    {{ installer_script_folder }}/install-java-tools.sh
    {{ installer_script_folder }}/install-kubernetes-tools.sh
    {{ installer_script_folder }}/install-oc-cli.sh
    {{ installer_script_folder }}/install-leiningen.sh
    {{ installer_script_folder }}/install-miniconda.sh
    {{ installer_script_folder }}/install-mono.sh
    {{ installer_script_folder }}/install-kotlin.sh
    {{ installer_script_folder }}/install-mysql.sh
    {{ installer_script_folder }}/install-mssql-tools.sh
    {{ installer_script_folder }}/install-sqlpackage.sh
    {{ installer_script_folder }}/install-nginx.sh
    {{ installer_script_folder }}/install-nvm.sh
    {{ installer_script_folder }}/install-nodejs.sh
    {{ installer_script_folder }}/install-bazel.sh
    {{ installer_script_folder }}/install-oras-cli.sh
    {{ installer_script_folder }}/install-php.sh
    {{ installer_script_folder }}/install-postgresql.sh
    {{ installer_script_folder }}/install-pulumi.sh
    {{ installer_script_folder }}/install-ruby.sh
    {{ installer_script_folder }}/install-rlang.sh
    {{ installer_script_folder }}/install-rust.sh
    {{ installer_script_folder }}/install-julia.sh
    {{ installer_script_folder }}/install-sbt.sh
    {{ installer_script_folder }}/install-selenium.sh
    {{ installer_script_folder }}/install-terraform.sh
    {{ installer_script_folder }}/install-packer.sh
    {{ installer_script_folder }}/install-vcpkg.sh
    {{ installer_script_folder }}/configure-dpkg.sh
    {{ installer_script_folder }}/install-yq.sh
    {{ installer_script_folder }}/install-android-sdk.sh
    {{ installer_script_folder }}/install-pypy.sh
    {{ installer_script_folder }}/install-python.sh
    {{ installer_script_folder }}/install-zstd.sh
    {{ installer_script_folder }}/install-ninja.sh
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
    DEBIAN_FRONTEND: "noninteractive"

# ========================================
# Provisioner 17: Install Docker (with credentials)
# (shell: install-docker.sh with DOCKERHUB env vars)
# ========================================

- name: Install Docker
  shell: "{{ installer_script_folder }}/install-docker.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
    DOCKERHUB_LOGIN: "{{ dockerhub_login | default('') }}"
    DOCKERHUB_PASSWORD: "{{ dockerhub_password | default('') }}"

# ========================================
# Provisioner 18: PowerShell toolset configuration
# (shell: PowerShell scripts for toolset)
# ========================================

- name: Configure PowerShell toolset
  shell: |
    pwsh -f {{ installer_script_folder }}/Install-Toolset.ps1
    pwsh -f {{ installer_script_folder }}/Configure-Toolset.ps1
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"

# ========================================
# Provisioner 19: Install pipx packages
# (shell: install-pipx-packages.sh)
# ========================================

- name: Install pipx packages
  shell: "{{ installer_script_folder }}/install-pipx-packages.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"

# ========================================
# Provisioner 20: Install Homebrew (as regular user)
# (shell: install-homebrew.sh with /bin/sh instead of sudo)
# ========================================

- name: Install Homebrew
  shell: "{{ installer_script_folder }}/install-homebrew.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    DEBIAN_FRONTEND: "noninteractive"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
  become: false

# ========================================
# Provisioner 21: Configure snap
# (shell: configure-snap.sh)
# ========================================

- name: Configure snap
  shell: "{{ installer_script_folder }}/configure-snap.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"

# ========================================
# Provisioner 22: Reboot VM
# (shell: inline reboot with expect_disconnect)
# NOTE: For LXC, we simulate this with LXC compatibility
# ========================================

- name: Reboot VM (simulated for LXC)
  shell: echo 'Reboot VM'

# ========================================
# Provisioner 23: Cleanup (with pause and retry)
# (shell: cleanup.sh with pause_before=1m0s and start_retry_timeout=10m)
# ========================================

- name: Pause before cleanup (simulating Packer pause_before)
  pause:
    seconds: 60

- name: Run cleanup
  shell: "{{ installer_script_folder }}/cleanup.sh"

# ========================================
# Provisioner 24: Generate software reports
# (shell: inline PowerShell commands)
# ========================================

- name: Generate software reports
  shell: |
    pwsh -File {{ image_folder }}/SoftwareReport/Generate-SoftwareReport.ps1 -OutputDirectory {{ image_folder }}
    pwsh -File {{ image_folder }}/tests/RunAll-Tests.ps1 -OutputDirectory {{ image_folder }}
  environment:
    IMAGE_VERSION: "{{ image_version }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"

# ========================================
# Provisioner 25-26: Download reports
# (file: direction="download" for both reports)
# ========================================

- name: Fetch Ubuntu README to control machine
  fetch:
    src: "{{ image_folder }}/software-report.md"
    dest: "./Ubuntu2204-Readme.md"
    flat: yes

- name: Fetch software report JSON to control machine
  fetch:
    src: "{{ image_folder }}/software-report.json"
    dest: "./software-report.json"
    flat: yes

# ========================================
# Provisioner 27: Configure system
# (shell: configure-system.sh)
# ========================================

- name: Configure system
  shell: "{{ installer_script_folder }}/configure-system.sh"
  environment:
    HELPER_SCRIPT_FOLDER: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
    IMAGE_FOLDER: "{{ image_folder }}"

# ========================================
# Provisioner 28: Copy ubuntu2204.conf to /tmp/
# (file: ubuntu2204.conf -> /tmp/)
# ========================================

- name: Copy ubuntu2204.conf to /tmp/
  copy:
    src: "{{ runner_images_ubuntu_conf_src }}"
    dest: "/tmp/ubuntu2204.conf"
    mode: '0644'

# ========================================
# Provisioner 29: Move config to /etc/vsts/
# (shell: inline mkdir + cp commands)
# ========================================

- name: Configure machine instance
  shell: |
    mkdir -p /etc/vsts
    cp /tmp/ubuntu2204.conf /etc/vsts/machine_instance.conf

# ========================================
# Provisioner 30: Post-build validation
# (shell: post-build-validation.sh)
# ========================================

- name: Run post-build validation
  shell: "{{ installer_script_folder }}/post-build-validation.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"

# ========================================
# Provisioner 31: Final cleanup and deprovision
# (shell: inline sleep + waagent deprovision)
# NOTE: For LXC, we clean up fake files instead of waagent
# ========================================

- name: Final cleanup
  shell: sleep 30

- name: Clean up fake files created for LXC compatibility
  include_tasks: lxc-cleanup.yml 
---
# ========================================
# LXC Cleanup - Remove fake files
# ========================================
# Clean up all fake files created for LXC compatibility

- name: Remove fake waagent.conf
  file:
    path: /etc/waagent.conf
    state: absent
  ignore_errors: true

- name: Remove fake motd-news config
  file:
    path: /etc/default/motd-news
    state: absent
  ignore_errors: true

- name: Remove fake cloud-init templates directory
  file:
    path: /etc/cloud/templates
    state: absent
  ignore_errors: true

- name: Remove fake DMI system information
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /sys/class/dmi/id/product_name
    - /sys/class/dmi/id/sys_vendor
    - /sys/class/dmi/id
    - /sys/hypervisor/type
    - /sys/hypervisor
  ignore_errors: true

- name: Remove fake Azure agent files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/waagent/provisioned
    - /usr/local/bin/fake-azure-metadata
  ignore_errors: true

- name: Display cleanup summary
  debug:
    msg: |
      LXC cleanup completed:
      - Removed all fake Azure-specific files
      - Removed simulated VM/hypervisor information
      - Removed fake metadata endpoints
      - Container is now clean of LXC compatibility artifacts 
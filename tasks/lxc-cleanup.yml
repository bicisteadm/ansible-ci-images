---
# ========================================
# LXC Cleanup - Remove fake files
# ========================================
# Clean up all fake files created for LXC compatibility

- name: Remove fake motd-news configuration
  file:
    path: /etc/default/motd-news
    state: absent
  become: true
  ignore_errors: true

- name: Remove fake waagent.conf
  file:
    path: /etc/waagent.conf
    state: absent
  become: true
  ignore_errors: true

- name: Remove fake cloud-init templates directory
  file:
    path: /etc/cloud/templates
    state: absent
  become: true
  ignore_errors: true

- name: Remove fake Azure agent files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/waagent
  become: true
  ignore_errors: true
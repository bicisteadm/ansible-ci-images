---
# ========================================
# CI/CD Tools Installation
# ========================================

- name: Install GitHub Actions Cache
  shell: "{{ installer_script_folder }}/install-actions-cache.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
    DEBIAN_FRONTEND: "{{ debian_frontend }}"
  
- name: Install GitHub Runner Package
  shell: "{{ installer_script_folder }}/install-runner-package.sh"
  environment:
    HELPER_SCRIPTS: "{{ helper_script_folder }}"
    INSTALLER_SCRIPT_FOLDER: "{{ installer_script_folder }}"
    DEBIAN_FRONTEND: "{{ debian_frontend }}" 